[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer"
version = "0.3.0"
description = "Organize files into category folders based on their extension."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
dev = [
    "pytest>=9",
    "ruff>=0.6",
    "mypy>=1.10",
    "PySide6>=6.6",
    "pyinstaller>=6.10",
]

[project.scripts]
file-organizer = "app.__main__:main"
file-organizer-gui = "app.gui:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["app"]
strict = true
