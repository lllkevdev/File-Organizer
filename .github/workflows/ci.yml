name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Test
        run: pytest --cov=app --cov-report=term-missing

      - name: Check single-source version
        run: python -c "import re, pathlib; s = pathlib.Path('installer/file-organizer.iss').read_text(encoding='utf-8'); assert not re.search(r'\d+\.\d+\.\d+', s), 'version duplicada en el .iss'; print('version ok')"

      - name: Build distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m build

      - name: Verify installed wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          file-organizer --version

  build-windows:
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build executables
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File installer\build.ps1 -SkipInstaller

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: file-organizer-windows
          path: dist/
          if-no-files-found: error
